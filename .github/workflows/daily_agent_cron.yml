name: Morgan 24/7 Autonomous Daily Briefing

on:
  schedule:
    # Roda todos os dias às 11:00 UTC (08:00 horário de Brasília)
    - cron: '0 11 * * *'
  workflow_dispatch: # Permite disparar manualmente pelo botão "Run workflow" no GitHub

jobs:
  run-morgan-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Executar Auditoria Autônoma do Morgan
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          node scripts/autonomous_agent.js
